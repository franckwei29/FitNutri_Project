services:
  db:
    image: postgres:16.15
    container_name: fitnutri-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fitnutri}
      POSTGRES_USER: ${DB_USERNAME:-fitnutri}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD privately before starting PostgreSQL}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - fitnutri-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitnutri-pgdata:
