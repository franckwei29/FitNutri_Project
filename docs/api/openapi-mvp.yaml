  "openapi": "3.1.0",
  "info": {
    "title": "FitNutri canonical integration contract",
    "version": "mvp-1",
    "description": "Target v2.0 contract, NOT evidence of running implementations. JSON syntax is valid YAML1.2. IDs decimal strings, quantities finite JSON numbers, date ownership fixed, kJ authoritative. Errors do not contain raw input/SQL/provider output. Unconfigured services return503. All private resources current active USER only, admin paths ADMIN only. Version conflicts never overwrite. Late create outcome recovered by immutable receipt."
  },
