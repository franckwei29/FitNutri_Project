# DynamicPropertySource provides a unique explicitly owned PG16 target.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

server.servlet.session.cookie.secure=false

server.address=127.0.0.1

openai.api.key=
app.ai.key=
app.ai.image-model=
app.ai.transcription-model=
app.ai.parsing-model=
app.ai.qa-model=
app.ai.image-enabled=false
app.ai.transcription-enabled=false
app.ai.parsing-enabled=false
app.ai.qa-enabled=false

# Many isolated cached test contexts share the dedicated PG16 server. Keep real concurrent tests without 10 idle clients per context.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
