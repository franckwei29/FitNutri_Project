spring.application.name=backend
# Explicit backend environment only; never silently connect with committed development credentials.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Drain a bounded rejected upload so clients can receive the canonical 413 body.
# This does not increase the servlet acceptance or8MiB business limits.
server.tomcat.max-swallow-size=12MB
# Accepted media stays in memory; business validators enforce the stricter8MiB limit.
spring.servlet.multipart.file-size-threshold=10MB

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Migration is opt-in until reviewed schema rollout; never auto-adopt existing databases.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
app.default-zone=${APP_DEFAULT_ZONE:Australia/Sydney}

app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}
app.admin-bootstrap.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.admin-bootstrap.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.admin-bootstrap.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.admin-bootstrap.display-name=${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# No inferred timezone for pre-existing food/exercise timestamps.
app.migration.legacy-zone=${LEGACY_RECORD_ZONE:UNCONFIRMED}
app.migration.legacy-zone-approved=${LEGACY_RECORD_ZONE_APPROVED:false}

# Optional explicit manifest import. Existing catalogue versions are compared by hash, never by count.
app.catalogue.import-food=${IMPORT_FOOD_CATALOGUE:false}
app.catalogue.source-directory=${REFERENCE_SOURCE_DIR:}

app.catalogue.import-activity=${IMPORT_ACTIVITY_CATALOGUE:false}

# Readiness is configuration + canonical adapter registration + scope/data, never a paid provider probe.
app.ai.key=${OPENAI_API_KEY:}
app.ai.image-model=${OPENAI_IMAGE_MODEL:}
app.ai.transcription-model=${OPENAI_TRANSCRIPTION_MODEL:}
app.ai.parsing-model=${OPENAI_PARSING_MODEL:}
app.ai.qa-model=${OPENAI_QA_MODEL:}
app.ai.image-enabled=${AI_IMAGE_ENABLED:false}
app.ai.transcription-enabled=${AI_TRANSCRIPTION_ENABLED:false}
app.ai.parsing-enabled=${AI_PARSING_ENABLED:false}
app.ai.qa-enabled=${AI_QA_ENABLED:false}

# ORM exception messages can contain failing rows/SQL. Safe API status/operation/id logging is separate.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# Full-body provider deadline, separate from ordinary API reads; no automatic provider retries.
app.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:10000}
app.ai.processing-timeout-ms=${AI_PROCESSING_TIMEOUT_MS:60000}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1/}

# Local pipe-only audio decoder; missing executable keeps transcription unavailable.
app.audio.ffmpeg=${FFMPEG_BIN:ffmpeg}
app.audio.decode-timeout-ms=${AUDIO_DECODE_TIMEOUT_MS:10000}

# Explicit reviewed UX metadata import only, after the pinned official food catalogue.
app.catalogue.import-food-search=${IMPORT_FOOD_SEARCH_METADATA:false}

# UX exercise catalogue is opt-in; r1 source selection remains the default.
app.catalogue.activity-manifest=${ACTIVITY_MANIFEST:data/manifests/compendium-2024-r1.json}
app.catalogue.import-exercise-options=${IMPORT_EXERCISE_OPTIONS:false}
